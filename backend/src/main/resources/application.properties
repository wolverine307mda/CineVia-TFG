# Puerto del servidor
server.port=8080

# Configuración de PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geofilm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wolverine307}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin307204}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de HikariCP (Pool de conexiones)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway (Migraciones de base de datos)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false
spring.flyway.database.postgresql-version=15
spring.flyway.postgresql.transactional.lock=false
spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-on-migrate=true

# Redis (Caché)
spring.cache.type=redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=  # Si tu Redis tiene contraseña
spring.data.redis.timeout=2000

# Seguridad y CORS
spring.security.user.name=admin
spring.security.user.password=admin
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*

jwt.secret=miClaveSecretaEsEsta
jwt.expiration=3600

# Configuración de logs
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.beans.factory=INFO
logging.level.org.hibernate=INFO

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs