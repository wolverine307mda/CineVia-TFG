# ─── Server ─────────────────────────────────────────────────────────────────────
server.port=8080

# ─── Datasource (PostgreSQL) ─────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geofilm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wolverine307}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin307204}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Desactiva la impresión de SQL en consola (show_sql) :contentReference[oaicite:0]{index=0}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# Formatea SQL solo si lo activas para depuración puntual :contentReference[oaicite:1]{index=1}
spring.jpa.properties.hibernate.format_sql=true

# ─── HikariCP (Connection Pool) ─────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ─── Flyway (DB Migrations) ──────────────────────────────────────────────────────
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholder-replacement=false
spring.flyway.database.postgresql-version=15
spring.flyway.postgresql.transactional.lock=false
spring.flyway.clean-on-validation-error=true
spring.flyway.baseline-on-migrate=true

# ─── Redis (Cache) ───────────────────────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=    # Si Redis requiere auth
spring.data.redis.timeout=2000

# ─── Seguridad / CORS / JWT ──────────────────────────────────────────────────────
spring.security.user.name=admin
spring.security.user.password=admin
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*

jwt.secret=miClaveSecretaEsEsta
jwt.expiration=3600

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Logging ─────────────────────────────────────────────────────────────────────
# Root a INFO para ocultar DEBUG de Spring Boot, Hibernate, etc. :contentReference[oaicite:2]{index=2}
logging.level.org.springframework.web=DEBUG

# Hibernate: desactiva logs de SQL y de binding parameters :contentReference[oaicite:3]{index=3}
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Spring Security: sube a INFO para quitar DEBUG de FilterChain, AnonymousAuth, etc. :contentReference[oaicite:4]{index=4}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access.ExceptionTranslationFilter=TRACE


# Otros paquetes de Spring a INFO (puedes ajustar fines de cache o data)
logging.level.org.springframework=INFO
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis=INFO

# Si quieres desactivar completamente cualquier log en consola:
